<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blaze &amp; Blade – Web Remake</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; color: #ddd; font: 13px/1.4 monospace; overflow: hidden; }
      canvas { display: block; }
      #hud { position: fixed; top: 8px; left: 8px; max-width: 360px; background: #000a; padding: 8px 10px; border: 1px solid #333; }
      #hud select, #hud button { font: inherit; margin: 2px 2px 2px 0; }
      #title { position: fixed; inset: 0; z-index: 10; background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
      #title img { width: min(100vw, 114.28vh); max-height: 100vh; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="title"><img src="assets/ui/title.png" alt="Blaze &amp; Blade: Eternal Quest – click or press a key to start" /></div>
    <div id="hud">
      <b>Blaze &amp; Blade remake</b> <span id="ver">v0.0.1 (pre-alpha)</span><br />
      <span id="status">loading sound manifest…</span><br />
      <select id="bank"></select> <select id="clip"></select> <button id="play">▶ play</button><br />
      <small>play-mode sound slots (guessed defaults): </small><select id="slot"></select> <button id="assign">assign current clip</button> <label><input type="checkbox" id="mute" /> mute</label> <small id="slotinfo"></small>
    </div>
    <script>
      // robust start: the title must go away even if the app script fails, and errors are shown on screen (they are otherwise only in the console)
      (function () {
        var t = document.getElementById('title');
        var hide = function () { if (t) t.remove(); t = null; window.removeEventListener('keydown', hide); };
        t.addEventListener('click', hide);
        window.addEventListener('keydown', hide);
        var box = document.createElement('pre');
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;margin:0;padding:6px 10px;background:#400d;color:#fcc;font:12px monospace;z-index:20;display:none;white-space:pre-wrap';
        document.body.appendChild(box);
        var show = function (m) { box.style.display = 'block'; box.textContent += m + '\n'; };
        try {
          var c = document.createElement('canvas');
          if (!(c.getContext('webgl2') || c.getContext('webgl'))) show('WebGL is not available in this browser, so the 3D view cannot start. Enable hardware acceleration or try another browser.');
        } catch (e) { show('WebGL check failed: ' + e); }
        window.addEventListener('error', function (e) { show('error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'); });
        window.addEventListener('unhandledrejection', function (e) { show('rejected: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
